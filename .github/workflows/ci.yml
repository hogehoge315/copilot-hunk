name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run tests (Neovim ${{ matrix.neovim }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        neovim: [stable, nightly]

    steps:
      - uses: actions/checkout@v4

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      - name: Install LuaRocks + busted
        run: |
          sudo apt-get install -y luarocks
          luarocks install busted

      - name: Run tests
        run: nvim --headless -l spec/minit.lua

  lint:
    name: Lint (luacheck)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install luacheck
        run: |
          sudo apt-get install -y luarocks
          luarocks install luacheck

      - name: Run luacheck
        run: luacheck lua/ plugin/ --globals vim --no-max-line-length
